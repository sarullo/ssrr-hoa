<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Message Sent — Sunnyside Ridge Road HOA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root { --gold:#B8965A; --gold-light:#D4B483; --forest:#2C4A3E; --forest-mid:#3D6B5C; --cream:#FAF7F2; --stone:#8A8378; --charcoal:#2A2825; --warm-white:#FFFDF9; --border:rgba(184,150,90,0.2); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"DM Sans",sans-serif; background:var(--cream); color:var(--charcoal); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .card { background:var(--warm-white); border:1px solid var(--border); border-radius:16px; padding:3rem 2.5rem; max-width:480px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(44,74,62,0.08); }
  .check { width:64px; height:64px; border-radius:50%; background:var(--forest); margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; }
  .check svg { width:30px; height:30px; fill:none; stroke:var(--gold-light); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-family:"Playfair Display",serif; color:var(--forest); font-size:1.7rem; margin-bottom:0.75rem; }
  p { color:var(--stone); font-size:0.95rem; line-height:1.7; margin-bottom:1.75rem; }
  a.btn { display:inline-block; background:var(--forest); color:#fff; text-decoration:none; font-weight:600; font-size:0.92rem; padding:0.8rem 1.75rem; border-radius:8px; transition:background 0.2s; }
  a.btn:hover { background:var(--forest-mid); }
</style>
</head>
<body>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-12"/></svg></div>
    <h1>Message Sent</h1>
    <p>Thank you for reaching out to the Sunnyside Community Association. A board member will get back to you soon.</p>
    <a class="btn" href="/">← Back to Home</a>
  </div>
</body>
</html>
